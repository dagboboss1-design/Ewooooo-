[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forex-quant-phase1"
version = "0.1.0"
description = "Phase 1 reproducible Forex data layer"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pandas>=2.2,<3",
  "pyarrow>=16,<25",
  "SQLAlchemy>=2.0,<3",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "python-dotenv>=1.0,<2",
  "lz4>=4.3,<5",
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.29,<1"
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<2", "respx>=0.21,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["forex_quant*"]

[tool.setuptools.package-data]
"forex_quant.dashboard" = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
